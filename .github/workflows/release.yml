name: Release

on:
  push:
    tags:
      - 'v*'
  # Builds some of the platforms for the version in package.json, from the
  # branch or tag it is run on. Run on a branch, no tag is pushed: publishing
  # the draft makes the tag. To add the rest to a release already published,
  # set it back to a draft, run this on its tag, and publish it again.
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which builds to make'
        type: choice
        default: mac-arm64
        options:
          - mac-arm64
          - rest
          - all

permissions:
  contents: write

jobs:
  # Makes the draft before either build starts. electron-builder creates one
  # when none exists, and two builds that both find none make two drafts with
  # the assets split between them; with one already there, both upload to it
  # and can run side by side.
  create-draft:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.draft.outputs.targets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create release draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          TARGETS: ${{ inputs.targets }}
        run: |
          if [ "$EVENT" = "push" ]; then
            TAG="$REF_NAME"
            TARGETS=all
          else
            TAG="v$(jq -r .version package.json)"
          fi
          DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ -z "$DRAFT" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "${TAG#v}" --notes "" --target "$GITHUB_SHA"
          elif [ "$DRAFT" = "false" ]; then
            # Already published: electron-builder won't upload to it. This is
            # also the tag push that publishing a draft built here sets off.
            echo "Release $TAG is already published; nothing to build."
            TARGETS=none
          fi
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  build-macos:
    runs-on: macos-14
    needs: create-draft
    if: contains(fromJSON('["all", "mac-arm64"]'), needs.create-draft.outputs.targets)
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject OAuth Credentials and License Server
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          # A public URL, so a repository variable rather than a secret. Without
          # it a purchase is not delivered to the app automatically.
          LICENSE_SERVER_URL: ${{ vars.LICENSE_SERVER_URL }}
        run: |
          echo "GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID" >> .env.local
          echo "GOOGLE_OAUTH_CLIENT_SECRET=$GOOGLE_OAUTH_CLIENT_SECRET" >> .env.local
          echo "LICENSE_SERVER_URL=$LICENSE_SERVER_URL" >> .env.local

      - name: Build Standalone and Electron Main
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npx next build
          node scripts/prepare-standalone.mjs
          npm run electron:compile

      - name: Build and Publish DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --arm64 --publish always

  # Intel Macs. Built on an Intel runner so the native modules (SQLite,
  # canvas, llama.cpp) are compiled for x64 rather than cross-built.
  build-macos-x64:
    runs-on: macos-15-intel
    needs: create-draft
    if: contains(fromJSON('["all", "rest"]'), needs.create-draft.outputs.targets)
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject OAuth Credentials and License Server
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          # A public URL, so a repository variable rather than a secret. Without
          # it a purchase is not delivered to the app automatically.
          LICENSE_SERVER_URL: ${{ vars.LICENSE_SERVER_URL }}
        run: |
          echo "GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID" >> .env.local
          echo "GOOGLE_OAUTH_CLIENT_SECRET=$GOOGLE_OAUTH_CLIENT_SECRET" >> .env.local
          echo "LICENSE_SERVER_URL=$LICENSE_SERVER_URL" >> .env.local

      - name: Build Standalone and Electron Main
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npx next build
          node scripts/prepare-standalone.mjs
          npm run electron:compile

      - name: Build and Publish Intel DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --x64 --publish always

  build-windows:
    runs-on: windows-latest
    needs: create-draft
    if: contains(fromJSON('["all", "rest"]'), needs.create-draft.outputs.targets)
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject OAuth Credentials and License Server
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          LICENSE_SERVER_URL: ${{ vars.LICENSE_SERVER_URL }}
        run: |
          echo "GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID" >> .env.local
          echo "GOOGLE_OAUTH_CLIENT_SECRET=$GOOGLE_OAUTH_CLIENT_SECRET" >> .env.local
          echo "LICENSE_SERVER_URL=$LICENSE_SERVER_URL" >> .env.local

      # Builds the installer (MeganStudy-Setup-<version>-x64.exe) and the portable
      # exe (MeganStudy-Portable-<version>-x64.exe) and uploads both to the draft.
      - name: Build and Publish Installer and Portable
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: "--max-old-space-size=4096"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win -- --publish always

  build-windows-arm64:
    runs-on: windows-11-arm
    needs: create-draft
    if: contains(fromJSON('["all", "rest"]'), needs.create-draft.outputs.targets)
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject OAuth Credentials and License Server
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          LICENSE_SERVER_URL: ${{ vars.LICENSE_SERVER_URL }}
        run: |
          echo "GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID" >> .env.local
          echo "GOOGLE_OAUTH_CLIENT_SECRET=$GOOGLE_OAUTH_CLIENT_SECRET" >> .env.local
          echo "LICENSE_SERVER_URL=$LICENSE_SERVER_URL" >> .env.local

      # Windows on ARM (Surface, Snapdragon laptops), built natively.
      - name: Build and Publish Installer and Portable
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: "--max-old-space-size=4096"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win-arm64 -- --publish always
